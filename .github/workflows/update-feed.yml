name: Update feed.json

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと
  workflow_dispatch: {}        # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RSSを取得して feed.json を更新
        run: python3 scripts/fetch_feed.py

      - name: 変更があればコミット
        run: |
          if [ -n "$(git status --porcelain feed.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.json
            git commit -m "Update feed.json"
            git push
          else
            echo "更新なし"
          fi
